name: bgp-lab

topology:
  nodes:
    sonic1:
      kind: sonic-vm
      image: vrnetlab/sonic_sonic-vs:latest

    sonic2:
      kind: sonic-vm
      image: vrnetlab/sonic_sonic-vs:latest

    server1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 10.10.0.1/31 dev eth1
        - ip link set eth1 up
        - ip route add 10.20.0.0/31 via 10.10.0.0

    server2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 10.20.0.1/31 dev eth1
        - ip link set eth1 up
        - ip route add 10.10.0.0/31 via 10.20.0.0

  links:
    - endpoints: ["sonic1:eth1", "server1:eth1"]
    - endpoints: ["sonic1:eth2", "sonic2:eth1"]
    - endpoints: ["sonic2:eth2", "server2:eth1"]
