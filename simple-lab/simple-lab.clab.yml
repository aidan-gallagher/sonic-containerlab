name: simple-lab

topology:
  nodes:
    sonic:
      kind: sonic-vm
      image: vrnetlab/sonic_sonic-vs:latest

    server1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 10.0.0.1/31 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.2/31 via 10.0.0.0

    server2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 10.0.0.3/31 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/31 via 10.0.0.2

  links:
    - endpoints: ["sonic:eth1", "server1:eth1"]
    - endpoints: ["sonic:eth2", "server2:eth1"]
