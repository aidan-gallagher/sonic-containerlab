name: sonic-lab

topology:
  nodes:
    sonic:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      exec:
        - bash -c 'until sonic-db-cli PING 2>/dev/null | grep -q PONG; do sleep 5; done'
        - config interface startup Ethernet0
        - config interface startup Ethernet4
        - config interface ip add Ethernet0 192.168.1.1/24
        - config interface ip add Ethernet4 192.168.2.1/24

    server1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.1.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.2.0/24 via 192.168.1.1

    server2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.2.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.1.0/24 via 192.168.2.1

  links:
    - endpoints: ["sonic:eth1", "server1:eth1"]
    - endpoints: ["sonic:eth2", "server2:eth1"]
